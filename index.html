<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当代大学生幸福指数调查</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  body { min-height:100vh; background:linear-gradient(160deg,#FFF3E6 0%,#FFE3C2 45%,#FFD1A1 100%); display:flex; justify-content:center; padding:24px 12px; }
  .card { width:100%; max-width:640px; background:#FFFDF9; border-radius:20px; box-shadow:0 12px 40px rgba(255,120,40,.18); padding:28px 24px; }
  h1 { font-size:22px; color:#E8641B; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#B07850; font-size:13px; margin-bottom:18px; }
  .progress-wrap { background:#F7E3CE; border-radius:99px; height:12px; overflow:hidden; margin-bottom:6px; }
  .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#FFB26B,#FF7A29); border-radius:99px; transition:width .35s ease; }
  .progress-text { display:flex; justify-content:space-between; font-size:12px; color:#C08A5E; margin-bottom:18px; }
  .step { display:none; animation:fade .3s ease; }
  .step.active { display:block; }
  @keyframes fade { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .q-title { font-size:16px; font-weight:600; color:#5C3A21; line-height:1.6; margin-bottom:14px; }
  .opt { display:block; background:#FFF6EC; border:2px solid #F3DCC3; border-radius:12px; padding:12px 14px; margin-bottom:10px; cursor:pointer; color:#6B4226; font-size:15px; transition:all .15s; }
  .opt:hover { border-color:#FFA25E; background:#FFEFDD; }
  .opt.sel { border-color:#FF7A29; background:#FFE3C7; font-weight:600; }
  input[type=number], select { width:100%; padding:12px; border:2px solid #F3DCC3; border-radius:12px; font-size:15px; background:#FFF6EC; color:#5C3A21; }
  .btn-row { display:flex; gap:10px; margin-top:20px; }
  button { flex:1; border:none; border-radius:12px; padding:13px; font-size:16px; cursor:pointer; }
  .btn-main { background:linear-gradient(90deg,#FF9A4D,#FF7A29); color:#fff; font-weight:600; box-shadow:0 6px 16px rgba(255,122,41,.35); }
  .btn-ghost { background:#FBE9D4; color:#B07850; }
  .score-big { font-size:56px; font-weight:800; color:#FF7A29; text-align:center; margin:10px 0; }
  .score-label { text-align:center; color:#B07850; font-size:14px; margin-bottom:14px; }
  .quote { background:#FFF1E0; border-left:4px solid #FF9A4D; border-radius:10px; padding:14px 16px; color:#7A4A24; font-size:15px; line-height:1.8; }
  .tag { display:inline-block; background:#FFE0BF; color:#D96A10; border-radius:99px; padding:3px 14px; font-size:13px; margin-bottom:8px; }
  .note { font-size:12px; color:#C08A5E; margin-top:10px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <h1>当代大学生幸福指数调查</h1>
  <div class="sub">匿名作答 · 课程作业 · 约 3 分钟</div>

  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="progress-text"><span id="stepLabel">基础信息</span><span id="pct">0%</span></div>

  <div id="steps"></div>
</div>

<script>
// ===== 本机提交限制：同一浏览器只能提交一次 =====
const DONE_TS = localStorage.getItem("hp_done");
if (DONE_TS) {
  document.querySelector(".card").innerHTML =
    '<h1>当代大学生幸福指数调查</h1>' +
    '<div class="sub">匿名作答 · 课程作业</div>' +
    '<div class="quote" style="margin-top:16px">本机已于 <b>' + DONE_TS + '</b> 提交过问卷，感谢参与！<br>' +
    '<span style="font-size:13px;color:#C08A5E">重复填写会影响统计结果，每位同学请只作答一次。如需帮同学代填，请换一台设备。</span></div>';
  throw new Error("already submitted");
}

const QUESTIONS = [
  {id:"b0",  type:"score", q:"如果把最理想的生活记 10 分、最糟糕的生活记 0 分，你给现在的生活打几分？"},
  {id:"b1",  type:"freq",  q:"近一个月，我感到开心 / 愉快。", dim:"pa"},
  {id:"b2",  type:"freq",  q:"近一个月，我对学习、校园生活或日常事务有兴趣。", dim:"pa"},
  {id:"b3",  type:"freq",  q:"近一个月，我感到压力大、紧绷。", dim:"na", reverse:true},
  {id:"b4",  type:"freq",  q:"近一个月，我感到情绪低落、提不起劲。", dim:"na", reverse:true},
  {id:"c1",  type:"agree", q:"近一月多数日子我睡眠充足、醒来有精神。", dim:"phys"},
  {id:"c2",  type:"agree", q:"我每周运动 2 次及以上。", dim:"phys"},
  {id:"c3",  type:"agree", q:"我不必为基本生活开销过度担忧。", dim:"stable"},
  {id:"c4",  type:"agree", q:"考试、选课、实习、毕业要求等关键节点，我能提前知道并做准备。", dim:"stable"},
  {id:"c5",  type:"agree", q:"遇到难事，我能找到可信任的同学 / 朋友 / 家人。", dim:"belong"},
  {id:"c6",  type:"agree", q:"需要时，辅导员 / 班主任、心理中心、学业或就业指导能给我实际帮助。", dim:"belong"},
  {id:"c7",  type:"agree", q:"我的努力和能力能被老师或同伴看见。", dim:"esteem"},
  {id:"c8",  type:"agree", q:"作为普通学生，我也能被平等对待。", dim:"esteem"},
  {id:"d1",  type:"agree", q:"我对大学阶段和未来方向有比较清晰的目标。", dim:"growth"},
  {id:"d2",  type:"agree", q:"每周都有一些时间做让我觉得有意义、愿意投入的事。", dim:"growth"},
];
const OPTIONAL = [
  {id:"a1", q:"你的年级", type:"select", opts:["大一","大二","大三","大四","硕士及以上"]},
  {id:"a6", q:"你的学科门类", type:"select", opts:["人文社科","理工农医","经管法","艺术体育","其他"]},
  {id:"a2", q:"每月生活费", type:"select", opts:["1000元以下","1000–1500元","1500–2000元","2000–3000元","3000元以上"]},
  {id:"a3", q:"近一月兼职强度", type:"select", opts:["无兼职","10小时以内","10–20小时","20小时以上"]},
  {id:"a4", q:"目前是否担任班委或学生会成员", type:"radio", opts:["是","否"]},
  {id:"a5", q:"是否参加过竞赛或做过项目", type:"radio", opts:["是","否"]},
];
const FREQ_OPTS = ["从未","很少","有时","经常","总是"];
const AGREE_OPTS = ["很不同意","不同意","一般","同意","很同意"];

const stepsEl = document.getElementById("steps");
const answers = {};
let cur = 0;
const allSteps = [];

(function(){
  const div = document.createElement("div");
  div.className = "step active";
  let inner = `<div class="q-title">基础信息（匿名，仅用于分组统计）</div>`;
  OPTIONAL.forEach(o=>{
    inner += `<div style="margin-bottom:12px"><div style="font-size:14px;color:#8A5A33;margin-bottom:6px">${o.q}</div>`;
    if(o.type === "select") inner += `<select id="inp_${o.id}"><option value="">请选择</option>` + o.opts.map(x=>`<option>${x}</option>`).join("") + `</select>`;
    else inner += o.opts.map(x=>`<label class="opt" data-id="${o.id}" data-val="${x}" style="display:inline-block;margin-right:8px">${x}</label>`).join("");
    inner += `</div>`;
  });
  inner += `<div class="btn-row"><button class="btn-main" onclick="startFormal()">开始正式答题</button></div>`;
  div.innerHTML = inner;
  stepsEl.appendChild(div);
  allSteps.push(div);
})();

function buildStep(item){
  const div = document.createElement("div");
  div.className = "step";
  let inner = `<div class="q-title">${item.q}</div>`;
  if(item.type === "score"){
    inner += `<input type="number" id="inp_${item.id}" min="0" max="10" step="1" placeholder="0–10 分">`;
  } else {
    const opts = item.type === "freq" ? FREQ_OPTS : AGREE_OPTS;
    inner += opts.map((t,i)=>`<label class="opt" data-id="${item.id}" data-val="${i+1}">${i+1}. ${t}</label>`).join("");
  }
  inner += `<div class="btn-row"><button class="btn-ghost" onclick="go(-1)">上一题</button>`;
  inner += `<button class="btn-main" onclick="next()">下一题</button></div>`;
  div.innerHTML = inner;
  stepsEl.appendChild(div);
  allSteps.push(div);
}
QUESTIONS.forEach(buildStep);

(function(){
  const div = document.createElement("div");
  div.className = "step";
  div.innerHTML = `<div class="q-title" style="text-align:center">你的幸福指数</div>
    <div class="score-big" id="scoreNum">--</div>
    <div class="score-label" id="scoreTag"></div>
    <div class="quote" id="quote"></div>
    <div class="note">感谢参与，你的反馈已记录。每位同学请只作答一次。</div>`;
  stepsEl.appendChild(div);
  allSteps.push(div);
})();

document.addEventListener("click", e=>{
  const el = e.target.closest(".opt");
  if(!el) return;
  const id = el.dataset.id;
  document.querySelectorAll(`.opt[data-id="${id}"]`).forEach(o=>o.classList.remove("sel"));
  el.classList.add("sel");
  answers[id] = el.dataset.val;
});

function startFormal(){
  for(const o of OPTIONAL){
    if(o.type === "select"){
      const v = document.getElementById("inp_"+o.id).value;
      if(!v){ alert("请完成全部基础信息后再开始"); return; }
      answers[o.id] = v;
    } else {
      if(answers[o.id] === undefined){ alert("请完成全部基础信息后再开始"); return; }
    }
  }
  cur = 1; show();
}
function go(d){ cur += d; show(); }
function next(){
  const item = QUESTIONS[cur-1];
  if(item.type === "score"){
    const v = document.getElementById("inp_"+item.id).value;
    if(v === "" || v < 0 || v > 10){ alert("请填写 0–10 之间的整数"); return; }
    answers[item.id] = v;
  }
  if(answers[item.id] === undefined){ alert("请选择一个选项"); return; }
  cur++;
  if(cur === allSteps.length - 1) finish(); else show();
}
function show(){
  allSteps.forEach((s,i)=>s.classList.toggle("active", i===cur));
  const total = QUESTIONS.length;
  if(cur >= 1 && cur <= total){
    document.getElementById("stepLabel").textContent = `第 ${cur} 题 / 共 ${total} 题`;
    const pct = Math.round((cur-1)/total*100);
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("pct").textContent = pct + "%";
  } else if (cur === 0){
    document.getElementById("stepLabel").textContent = "基础信息";
    document.getElementById("bar").style.width = "0%";
    document.getElementById("pct").textContent = "0%";
  } else {
    document.getElementById("bar").style.width = "100%";
    document.getElementById("pct").textContent = "100%";
    document.getElementById("stepLabel").textContent = "完成";
  }
}

const norm = v => (v-1)/4*100;
const dimAvg = dim => {
  const qs = QUESTIONS.filter(q=>q.dim===dim);
  const vals = qs.map(q=>{
    let v = Number(answers[q.id]);
    if(q.reverse) v = 6 - v;
    return norm(v);
  });
  return vals.reduce((a,b)=>a+b,0)/vals.length;
};
function calc(){
  const b0 = Number(answers.b0)*10;
  return Math.round(b0*0.30 + dimAvg("pa")*0.15 + dimAvg("na")*0.15
    + dimAvg("phys")*0.10 + dimAvg("stable")*0.10 + dimAvg("belong")*0.15
    + dimAvg("esteem")*0.10 + dimAvg("growth")*0.10);
}
function quoteOf(s){
  if(s>=85) return ["状态很棒","你的幸福感很高：目标、支持和情绪大体在线。愿你把这份高能量分一点给身边的人，也给自己留出不紧绷的余地。"];
  if(s>=70) return ["总体不错","你的幸福感良好，基本盘稳，个别维度还有上升空间。幸福感不是终点，是每天被小事慢慢垫高的台阶。"];
  if(s>=55) return ["需要调频","你的幸福感中等，情绪或支持维度可能在拖分。先盯住睡眠和一件可完成的小事，恢复感比完美计划更重要。"];
  return ["先照顾自己","你的幸福感偏低，这不说明你不好，只说明现在的负荷超出了支持。请认真考虑找信任的人聊聊，或预约学校心理中心。"];
}
function finish(){
  const s = calc();
  const [tag, quote] = quoteOf(s);
  document.getElementById("scoreNum").textContent = s;
  document.getElementById("scoreTag").innerHTML = `<span class="tag">${tag}</span><br>满分 100，依据主观幸福感与需求层次自编指标合成`;
  document.getElementById("quote").textContent = "🌤 " + quote;
  answers.score = s;
  // 记录本机已提交，并静默提交后台
  try { localStorage.setItem("hp_done", new Date().toLocaleString("zh-CN")); } catch(e) {}
  fetch("https://script.google.com/macros/s/AKfycbycIdiW-rQXsFOYS8cGMY-e2fgk0K5EbnZY2WmvbsRI2g-bkN3La9gsZFch_6ZtcerlHg/exec", {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(answers)}).catch(()=>{});
  show();
}
show();
</script>
</body>
</html>
